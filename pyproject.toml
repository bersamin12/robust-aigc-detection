[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigcdet"
version = "0.1.0"
# Held at 3.11 for Kaggle compatibility; Kaggle notebooks run Python 3.11
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26", "pillow>=10", "scipy>=1.11", "opencv-python-headless>=4.9",
    "pandas>=2.1", "pyarrow>=14", "scikit-learn>=1.4", "tqdm>=4.66", "pyyaml>=6",
    # torch and transformers are imported from src/ (models, train, features),
    # so a clean `pip install -e .` without them yields an unimportable
    # package. Lower bounds only, deliberately loose: the project environment
    # already carries torch 2.10 / transformers 5.3 and these must not fight
    # it. transformers>=4.53 is the floor that has DINOv3 and SigLIP2.
    "torch>=2.0", "transformers>=4.53",
    # `eva02l` is published as a timm repo, which AutoModel resolves through
    # TimmWrapperModel -- and that wrapper needs timm itself present. A main
    # dependency and NOT an optional extra: kaggle_bootstrap.install_plan reads
    # [project].dependencies and installs only what is genuinely missing, so on
    # Kaggle (whose image already ships timm) this costs nothing, while an
    # extra would simply never be installed there.
    "timm>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only needed by aigcdet.features.recon's reconstruction branch (spec §3.3):
# the SD 1.5 VAE (via diffusers) and LPIPS. Neither is installed in this
# project's dev/test environment and neither should be -- see
# project-constraints.md's no-GPU/no-download limits. recon.py imports both
# lazily, inside load_recon_models, so the package stays importable and
# testable (with a stub standing in for the real models) without them.
recon = ["diffusers>=0.30", "lpips>=0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA device and downloads model weights"]
